name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Checkstyle, all tests (Testcontainers needs Docker, which the runner provides) and the JaCoCo coverage rule
      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B verify
