services:
  postgres:
    image: postgres:16-alpine
    container_name: playerscores-db
    restart: unless-stopped
    env_file: .env
    ports:
      - "5400:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: playerscores-api
    restart: unless-stopped
    ports:
      - "8085:8080"
    env_file: .env
    environment:
      # the container runs the prod profile (health endpoint only, quieter logs); application.properties defaults to dev (KI-20)
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy

# Le volume nommé persiste les données entre arrêts (docker compose down).
# Seul "docker compose down -v" supprime les données.
volumes:
  postgres_data:
