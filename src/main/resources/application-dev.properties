# The dev profile is the local stack (ADR-0017): same values whether the API is started by
# `node tools/local-stack/stack.mjs api` or by an IDE run configuration, with no environment variable.

# Secrets and local settings (API_KEY, WEBHOOK_SECRET, WEBHOOK_URL, HYPIXEL_API_KEY): ../local/api.env, created by
# `stack.mjs init`. The path is relative to the working directory (this module). Never put production values there.
spring.config.import=optional:file:../local/api.env[.properties]

# DataSource: the local database of the local stack (`stack.mjs db`, container bsr-local-db), not the production one
spring.datasource.url=jdbc:postgresql://localhost:5401/playerscores
spring.datasource.username=playerscores
spring.datasource.password=playerscores
spring.datasource.driver-class-name=org.postgresql.Driver

# 8090, not 8080 (often held by other local projects); the local bot and plugin target it
server.port=8090

# Webhooks go to the local bot, never to the production one (KI-49)
webhook.url=${WEBHOOK_URL:http://localhost:3000/internal/match-result}

# Actuator (dev : tout exposer)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
