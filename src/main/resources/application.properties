# Active profile (override via -Dspring.profiles.active=prod)
spring.profiles.active=dev
# Server
server.port=8080
# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# MyBatis
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-handlers-package=net.bowspleef.ranked.typehandler
# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
# API Key
api.key=${API_KEY}
# Hypixel
hypixel.api-key=${HYPIXEL_API_KEY:}
# Rating (OpenSkill Weng-Lin Plackett-Luce; displayed elo = startingElo + ordinalScale * (mu - 3*sigma))
elo.floor=100
elo.starting-elo=1000
elo.ordinal-scale=10
elo.mu=25.0
elo.sigma=8.333333333333334
elo.beta=4.166666666666667
elo.kappa=0.0001
elo.tau=0.0
elo.recompute-delay-ms=5000
# Classic Elo, for seasons played before 2026-07-16 (ADR-0013); values as used until then
elo.classic.floor=100
elo.classic.starting-elo=1000
elo.classic.provisional-threshold=10
elo.classic.established-threshold=30
elo.classic.k-provisional=40
elo.classic.k-developing=20
elo.classic.k-established=10
# Duels
duel.challenge-ttl-minutes=60
duel.expiry-check-delay-ms=60000
# an ACTIVE duel nobody plays is cancelled after this many hours (spec 006)
duel.active-expiry-hours=24
# Queue
queue.elo-tolerance=100
queue.entry-ttl-minutes=60
queue.cleanup-delay-ms=60000
# Party
party.invite-ttl-minutes=60
party.max-size=16
party.invite-expiry-check-delay-ms=60000
# Replays of the custom server (spec 024): the largest file kept, in bytes (2 MiB)
replay.max-size-bytes=2097152
# Webhook
webhook.enabled=true
webhook.url=http://backend.ranked.bowspleef.net:3000/internal/match-result
webhook.secret=${WEBHOOK_SECRET:}
# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
