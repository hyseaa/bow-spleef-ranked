# MyBatis
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-handlers-package=com.playerscores.typehandler

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# API Key (required by SecurityConfig; no real secret needed for tests)
api.key=test-api-key

# Webhook (disabled so integration tests never reach out to the real remote endpoint)
webhook.enabled=false

# Hypixel (not called by tests; the property must exist for HypixelClient)
hypixel.api-key=
